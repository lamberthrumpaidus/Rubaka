name: Remove first-party code comments safely
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/comment-cleanup.yml"
      - ".github/scripts/clean-comments.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clean first-party source comments
        run: python3 .github/scripts/clean-comments.py
      - name: Verify first-party JavaScript and inline scripts
        run: |
          python3 - <<'PY'
          import pathlib,re,subprocess
          root=pathlib.Path('.')
          skipped={'node_modules','dist','.git','.github','vendor','third_party','build'}
          files=[p for p in root.rglob('*') if p.is_file() and not(set(p.parts)&skipped)]
          tested=0
          for p in files:
              if p.suffix.lower() in {'.js','.mjs','.cjs'}:
                  samples=[p.read_text(encoding='utf-8')]
              elif p.suffix.lower() in {'.html','.htm'}:
                  src=p.read_text(encoding='utf-8')
                  samples=[m.group(2) for m in re.finditer(r'<script([^>]*)>([\s\S]*?)</script>',src,re.I) if not re.search(r'\bsrc\s*=|\btype\s*=\s*["\']application/',m.group(1),re.I) and m.group(2).strip()]
              else:
                  continue
              for code in samples:
                  pcheck=subprocess.run(['node','--input-type=module','--check'],input=code,text=True,capture_output=True)
                  if pcheck.returncode:
                      raise SystemExit(f'Syntax error in {p}: {pcheck.stderr}')
                  tested+=1
          print(f'Validated {tested} code sections')
          PY
      - name: Commit verified source cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No comments to remove."
          else
            git commit -m "refactor: remove first-party comments; keep third-party assets and licenses"
            git push origin HEAD:main
          fi
